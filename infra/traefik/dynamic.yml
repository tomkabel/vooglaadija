http:
  middlewares:
    # Global rate limiting at the gateway level
    # This provides defense-in-depth: even if the app-level limiter fails,
    # the gateway enforces a hard ceiling.
    gateway-ratelimit:
      rateLimit:
        average: 100
        burst: 150
        period: 1m
        sourceCriterion:
          ipStrategy:
            depth: 1

    # Stricter rate limit for auth endpoints (login/register/refresh)
    auth-ratelimit:
      rateLimit:
        average: 10
        burst: 15
        period: 1m
        sourceCriterion:
          ipStrategy:
            depth: 1

    # Security headers applied at the gateway
    gateway-security-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowOriginList:
          - "${CORS_ORIGINS}"
        accessControlMaxAge: 86400
        addVaryHeader: true
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          X-Powered-By: ""

    # Circuit breaker at the gateway level
    gateway-circuit-breaker:
      circuitBreaker:
        expression: "NetworkErrorRatio() > 0.5"

    # Retry middleware for transient failures
    gateway-retry:
      retry:
        attempts: 3
        initialInterval: 100ms

  routers:
    api-router:
      rule: "PathPrefix(`/api`)"
      service: api
      middlewares:
        - gateway-ratelimit
        - gateway-security-headers
        - gateway-retry
      entryPoints:
        - websecure
      tls: {}

    auth-router:
      rule: "PathPrefix(`/api/v1/auth`)"
      service: api
      priority: 10
      middlewares:
        - auth-ratelimit
        - gateway-security-headers
        - gateway-retry
      entryPoints:
        - websecure
      tls: {}

    web-router:
      rule: "PathPrefix(`/web`)"
      service: api
      middlewares:
        - gateway-ratelimit
        - gateway-security-headers
      entryPoints:
        - websecure
      tls: {}

    health-router:
      rule: "Path(`/health`) || Path(`/health/ready`)"
      service: api
      priority: 20
      entryPoints:
        - websecure
      tls: {}

    docs-router:
      rule: "PathPrefix(`/docs`) || PathPrefix(`/redoc`) || PathPrefix(`/openapi.json`)"
      service: api
      middlewares:
        - gateway-ratelimit
        - gateway-security-headers
      entryPoints:
        - websecure
      tls: {}

    static-router:
      rule: "PathPrefix(`/static`)"
      service: api
      middlewares:
        - gateway-security-headers
      entryPoints:
        - websecure
      tls: {}

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://ytprocessor-api:8000"
        healthCheck:
          path: "/health/ready"
          interval: 15s
          timeout: 5s