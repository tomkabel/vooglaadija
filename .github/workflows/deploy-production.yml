name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pre-deploy-checks:
    name: Pre-deploy checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    steps:
      - name: Verify CI passed on this commit
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c379cacfc
        with:
          script: |
            // These check-run names correspond to the jobs in fastapi-test.yml
            // and docker-compose-test.yml. We poll until they all complete.
            const requiredChecks = [
              'Lint (Python + JS + CSS + Markdown + YAML)',
              'Type check with mypy',
              'Unit tests',
              'Integration tests',
              'Security scan',
              'Docker build check',
            ];

            const maxAttempts = 30; // 30 * 20s = 10 minutes
            const waitMs = 20000;

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const { data: { check_runs } } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
              });

              const pending = requiredChecks.filter(name => {
                const check = check_runs.find(cr => cr.name === name);
                return !check || check.status !== 'completed';
              });

              if (pending.length === 0) {
                // All completed - verify conclusions
                const failures = requiredChecks.map(name => {
                  const check = check_runs.find(cr => cr.name === name);
                  return { name, conclusion: check.conclusion };
                }).filter(c => c.conclusion !== 'success');

                if (failures.length > 0) {
                  const details = failures.map(f => `- ${f.name}: ${f.conclusion}`).join('\n');
                  core.setFailed(`Required checks did not pass:\n${details}`);
                  return;
                }

                core.info('All required CI checks passed');
                return;
              }

              core.info(`Waiting for checks to complete (attempt ${attempt}/${maxAttempts}): ${pending.join(', ')}`);
              await new Promise(resolve => setTimeout(resolve, waitMs));
            }

            core.setFailed('Timeout waiting for required CI checks to complete');

  deploy:
    name: Deploy to production
    needs: pre-deploy-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ vars.DEPLOY_DOMAIN }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@dc588b651fe13675773604f8950593fbcf303f58
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Add known hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "SSH_KNOWN_HOSTS secret is empty"
            exit 1
          fi

          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts

          while IFS= read -r host_key; do
            [ -n "$host_key" ] || continue
            grep -qF -- "$host_key" ~/.ssh/known_hosts 2>/dev/null || \
              printf '%s\n' "$host_key" >> ~/.ssh/known_hosts
          done <<< "$SSH_KNOWN_HOSTS"

      - name: Prepare deploy payload
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          ENV_FILE_PROD: ${{ secrets.ENV_FILE_PROD }}
        run: |
          install -m 700 -d .deploy-payload
          printf '%s' "$GHCR_PAT" > .deploy-payload/ghcr_pat
          printf '%s' "$ENV_FILE_PROD" > .deploy-payload/.env
          chmod 600 .deploy-payload/ghcr_pat .deploy-payload/.env

      - name: Deploy to server
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_REPO: ${{ github.event.repository.name }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          DEPLOY_TMP_DIR="/tmp/vooglaadija-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh "ubuntu@${SERVER_IP}" "mkdir -p '${DEPLOY_TMP_DIR}' && chmod 700 '${DEPLOY_TMP_DIR}'"
          scp infra/deploy/remote-deploy.sh "ubuntu@${SERVER_IP}:${DEPLOY_TMP_DIR}/remote-deploy.sh"
          scp .deploy-payload/ghcr_pat "ubuntu@${SERVER_IP}:${DEPLOY_TMP_DIR}/ghcr_pat"
          scp .deploy-payload/.env "ubuntu@${SERVER_IP}:${DEPLOY_TMP_DIR}/.env"
          ssh "ubuntu@${SERVER_IP}" "
            chmod 700 '${DEPLOY_TMP_DIR}/remote-deploy.sh' &&
            chmod 600 '${DEPLOY_TMP_DIR}/ghcr_pat' '${DEPLOY_TMP_DIR}/.env' &&
            IMAGE_TAG='${IMAGE_TAG}' \
            GHCR_OWNER='${GHCR_OWNER}' \
            GHCR_REPO='${GHCR_REPO}' \
            DEPLOY_DOMAIN='${DEPLOY_DOMAIN}' \
            GHCR_PAT_FILE='${DEPLOY_TMP_DIR}/ghcr_pat' \
            ENV_FILE_PATH='${DEPLOY_TMP_DIR}/.env' \
            bash '${DEPLOY_TMP_DIR}/remote-deploy.sh';
            status=\$?;
            rm -rf '${DEPLOY_TMP_DIR}';
            exit \$status
          "

      - name: Post-deploy health check
        env:
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: |
          for i in {1..12}; do
            if curl -fsS --max-time 10 "https://${DEPLOY_DOMAIN}/health" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"healthy"'; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after 60s"
          exit 1

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c379cacfc
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `## Production Deployment Failed

            Commit: \`${context.sha}\`
            Workflow: [${context.runId}](${runUrl})

            Please investigate and retry if appropriate.`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Production deployment failed for ${context.sha.substring(0, 7)}`,
              body: body,
              labels: ['deployment', 'failed']
            });
