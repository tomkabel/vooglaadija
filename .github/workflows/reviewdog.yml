name: Reviewdog Lint Annotations

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

env:
  PYTHON_VERSION: '3.12'
  HATCH_VERSION: '1.18.0'

jobs:
  ruff:
    name: ruff (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@a0b52019f16c97e3556f720a3c894238c92f87d7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install hatch
        run: uv tool install hatch==${{ env.HATCH_VERSION }}

      - name: Install reviewdog
        uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: v0.21.0

      - name: ruff
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          hatch run lint:check | reviewdog \
            -efm="%f:%l:%c: %t%f %m" \
            -name="ruff" \
            -reporter=github-pr-annotations \
            -filter-mode=diff-filter \
            -fail-level=any
        continue-on-error: true

  mypy:
    name: mypy (type check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@a0b52019f16c97e3556f720a3c894238c92f87d7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install hatch
        run: uv tool install hatch==${{ env.HATCH_VERSION }}

      - name: Install reviewdog
        uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: v0.21.0

      - name: mypy
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          hatch run type:check | reviewdog \
            -efm="%f:%l:%c: %t%n: %m" \
            -name="mypy" \
            -reporter=github-pr-annotations \
            -filter-mode=diff-filter \
            -fail-level=any
        continue-on-error: true
