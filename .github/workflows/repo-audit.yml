name: Weekly Repo Audit

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC — before CodeQL (09:00)
  workflow_dispatch:

concurrency:
  group: weekly-repo-audit
  cancel-in-progress: false

# Least privilege: no default permissions; each job declares only what it needs.
permissions: {}

jobs:
  # ============================================
  # AUTO-REMEDIATION - mechanical fixes become a PR (SWE@Google LSCs).
  # Only safe fixes (ruff F401/F841 + formatting); judgment findings stay
  # in the deep-scan issue. Maintainer merges; never force-merged.
  # ============================================
  auto-fix:
    name: AUTO-BOT cleanup PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # contents: write   -> push the chore/auto-bot/weekly-cleanup branch
    # pull-requests: write -> open the [AUTO-BOT] PR
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: main # always audit the default branch, even on manual dispatch
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@a0b52019f16c97e3556f720a3c894238c92f87d7
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install hatch
        run: uv tool install hatch==1.16.5

      - name: Apply safe fixes (unused imports + formatting)
        run: hatch run audit:fix

      - name: Detect changes
        id: changes
        run: |
          if git status --porcelain | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push cleanup branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Fetch the existing bot branch (when present) so --force-with-lease
          # is evaluated against current remote state; fail fast otherwise.
          if git ls-remote --exit-code --heads origin chore/auto-bot/weekly-cleanup >/dev/null 2>&1; then
            git fetch origin chore/auto-bot/weekly-cleanup
          fi
          git checkout -B chore/auto-bot/weekly-cleanup
          git add -A
          git commit -m "chore: [AUTO-BOT] weekly cleanup (unused imports, formatting)"
          git push origin chore/auto-bot/weekly-cleanup --force-with-lease

      - name: Open or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="Automated safe fixes from the weekly repo audit. Mechanical changes only: unused imports/variables and formatting. Review and merge; do not rebase (force-updated weekly)."
          if ! gh pr view chore/auto-bot/weekly-cleanup --json url -q .url >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head chore/auto-bot/weekly-cleanup \
              --title "[AUTO-BOT] Weekly cleanup (unused imports, formatting)" \
              --body "$BODY"
          fi

  # ============================================
  # DEEP SCAN - behavioral analysis (hotspots, temporal coupling, defensive
  # density, duplication) + gate re-verification. Advisory: exit code never
  # fails the workflow; the report lands in a single labeled issue + artifact.
  # ============================================
  deep-scan:
    name: Deep scan + report issue
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # contents: read  -> check out the code for analysis
    # issues: write   -> update the single repo-audit issue
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: main # always audit the default branch, even on manual dispatch
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@a0b52019f16c97e3556f720a3c894238c92f87d7
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install hatch
        run: uv tool install hatch==1.16.5

      - name: Install pinned JS tooling (jscpd)
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9
        with:
          version: 10.33.2
          run_install: |
            - args: [--frozen-lockfile]

      - name: Add node_modules/.bin to PATH (jscpd)
        run: echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run unit tests with coverage (hotspot x coverage correlation)
        run: hatch run test:unit

      - name: Run weekly audit
        run: hatch run audit:weekly -- --out-dir audit-report

      - name: Upload report artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: repo-audit-report
          path: audit-report/
          retention-days: 30

      - name: Update repo-audit issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c379cacfc
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('audit-report/audit-report.md', 'utf8');
            const label = 'repo-audit';
            const runLink = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${report}\n\n---\n_Generated by run [#${context.runNumber}](${runLink}) — full JSON report in workflow artifacts._`;
            const title = `Weekly Repo Audit — ${new Date().toISOString().slice(0, 10)}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: [label],
              per_page: 1,
            });
            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                title,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }
