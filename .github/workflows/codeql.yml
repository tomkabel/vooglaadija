name: 'CodeQL'

# DISABLED: This workflow is temporarily disabled.
# To re-enable, copy the triggers below into the `on:` section.
#
# on:
#   push:
#     branches: [main, develop]
#   pull_request:
#     branches: [main, develop]
#   schedule:
#     - cron: '33 7 * * 5'

on:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b0c4fd77f6c559021d78430ec4d0d169ae74a4eb
        with:
          languages: python
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b0c4fd77f6c559021d78430ec4d0d169ae74a4eb
        with:
          category: '/language:python'
