<div id="download-skeleton" aria-hidden="true" class="download-skeleton-wrap">
  {% for _ in range(3) %}
  <div class="download-row skeleton-row">
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-3">
        <div class="skeleton-icon"></div>
        <div class="skeleton-text-wrap">
          <div class="skeleton-text skeleton-text-long"></div>
          <div class="skeleton-text skeleton-text-short"></div>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div class="skeleton-pill"></div>
      <div class="skeleton-action"></div>
    </div>
  </div>
  {% endfor %}
</div>

<div
  id="download-announcer"
  class="sr-only"
  aria-live="polite"
  aria-atomic="true"
></div>

{% if jobs %}
<div class="bulk-toolbar flex flex-wrap items-center gap-3 mb-4" data-bulk-toolbar>
  <label class="flex items-center gap-2 text-sm text-gray-400 cursor-pointer select-none">
    <input
      type="checkbox"
      data-select-all
      class="form-checkbox h-4 w-4 rounded border-white/20 bg-white/5 text-amber-500 focus:ring-amber-500/40"
      aria-label="Select all downloads"
    />
    <span>Select all</span>
  </label>
  <span class="text-sm text-gray-400" data-bulk-count aria-live="polite">0 selected</span>
  <button
    type="button"
    class="btn-danger text-xs inline-flex items-center gap-1.5"
    data-bulk-delete
    hx-post="/web/downloads/bulk-delete"
    hx-include="[data-bulk-checkbox]:checked, [data-csrf-token]"
    hx-swap="none"
    hx-confirm="Delete the selected downloads? This action cannot be undone."
    disabled
    aria-label="Delete selected downloads"
  >
    <svg class="h-4 w-4" aria-hidden="true"><use href="/static/icons/sprite.svg#icon-trash" /></svg>
    Delete selected
  </button>
  <input type="hidden" data-csrf-token name="csrf_token" value="{{ csrf_token }}" />
</div>
{% endif %}

<div
  id="download-rows"
  role="feed"
  aria-label="Downloads"
  aria-live="polite"
  aria-atomic="false"
  aria-busy="false"
>
{% if jobs %}
  {% for job in jobs %}
    {% include 'partials/_download_item.html' %}
  {% endfor %}
{% else %}
  <div class="text-center py-16">
    <div
      class="mx-auto h-16 w-16 rounded-2xl bg-white/[0.03] border border-white/[0.06] flex items-center justify-center mb-5"
    >
      <svg class="h-8 w-8 text-gray-400" aria-hidden="true"><use href="/static/icons/sprite.svg#icon-video" /></svg>
    </div>
    <h3 class="text-lg font-display font-semibold text-gray-400 mb-2">
      No downloads yet
    </h3>
    <p class="text-gray-400 max-w-sm mx-auto font-body text-sm">
      Paste a YouTube URL above to start downloading
    </p>
  </div>
{% endif %}
</div>
