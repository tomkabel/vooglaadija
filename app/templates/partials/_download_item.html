<div class="download-row" data-job-id="{{ job.id }}">
  <div class="flex-1 min-w-0">
    <div class="flex items-center gap-3">
      <div
        class="h-10 w-10 rounded-xl bg-white/[0.04] border border-white/[0.06] flex items-center justify-center flex-shrink-0"
      >
        <svg class="h-5 w-5 text-gray-400" aria-hidden="true"><use href="/static/icons/sprite.svg#icon-video" /></svg>
      </div>
      <div>
        <p class="url-text" hx-disable title="{{ job.title or job.url }}">{{ job.title or job.url }}</p>
        <p class="timestamp" data-timestamp="{{ job.created_at.isoformat() if job.created_at else '' }}">
          {% if job.created_at %}
            {{ job.created_at.strftime('%b %d, %H:%M') }}
          {% endif %}
        </p>
      </div>
    </div>
  </div>

  <div class="flex items-center gap-3">
    {{ status_badge_html(job.status) | safe }} {% if job.status == 'completed' and job.file_name %}
    <a
      href="/web/downloads/{{ job.id }}/file"
      download
      target="_blank"
      hx-boost="false"
      class="download-btn text-xs"
    >
      <svg class="h-4 w-4" aria-hidden="true"><use href="/static/icons/sprite.svg#icon-download" /></svg>
      Save
    </a>
    {% endif %}

    <button
      type="button"
      hx-delete="/web/downloads/{{ job.id }}"
      hx-target="closest .download-row"
      hx-swap="outerHTML"
      hx-confirm="Delete this download?"
      aria-label="Delete download"
      class="btn-danger"
    >
      <svg class="h-5 w-5" aria-hidden="true"><use href="/static/icons/sprite.svg#icon-trash" /></svg>
    </button>
  </div>
</div>
