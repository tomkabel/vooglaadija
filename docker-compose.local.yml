# ============================================
# Local Development Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Adds local build targets (instead of pulling GHCR images) and exposes
# debug ports bound to loopback only. Not used in production.
# ============================================

services:
  api:
    image: vooglaadija-api:local
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      # Local dev runs over plain HTTP, so cookies must not require HTTPS.
      # This overrides any COOKIE_SECURE=True from the base file or .env;
      # production (standalone Caddy) uses COOKIE_SECURE=True from .env.
      COOKIE_SECURE: 'False'
    ports:
      # Caddy reverse-proxies to `api:8000` over the internal compose network.
      # The host port matches what CI expects so health-check curls hit :8000.
      - '127.0.0.1:8000:8000'

  worker:
    image: vooglaadija-worker:local
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    ports:
      - '127.0.0.1:8082:8082'

  db:
    ports:
      - '127.0.0.1:5432:5432'

  redis:
    ports:
      - '127.0.0.1:6380:6379'

  otel-collector:
    ports:
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
