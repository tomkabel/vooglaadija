# ============================================
# Local Development Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Adds local build targets (instead of pulling GHCR images) and exposes
# debug ports bound to loopback only. Not used in production.
# ============================================

services:
  api:
    image: vooglaadija-api:local
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      # Local dev runs over plain HTTP, so cookies must not require HTTPS.
      COOKIE_SECURE: 'False'
    ports:
      # Public ingress is handled by Caddy, which reverse-proxies to
      # `api:8000` over the internal compose network (see Caddyfile).
      # Do NOT bind host :8000 here — the API is only reachable through Caddy
      # (docker-compose.caddy.yml) on 80/443 in production. Expose the API
      # loopback debug port on 18000 instead.
      - '127.0.0.1:18000:8000'

  worker:
    image: vooglaadija-worker:local
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    ports:
      - '127.0.0.1:8082:8082'

  db:
    ports:
      - '127.0.0.1:5432:5432'

  redis:
    ports:
      - '127.0.0.1:6380:6379'

  otel-collector:
    ports:
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
