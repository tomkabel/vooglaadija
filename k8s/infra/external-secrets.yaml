# External Secret for Vooglaadija
# Requires External Secrets Operator (https://external-secrets.io/)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vooglaadija-secrets
  namespace: vooglaadija
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: vooglaadija-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        db-password: "{{ .db_password }}"
        redis-password: "{{ .redis_password }}"
        secret-key: "{{ .secret_key }}"
        grafana-admin-password: "{{ .grafana_admin_password }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: vooglaadija/production
        property: db_password
    - secretKey: redis_password
      remoteRef:
        key: vooglaadija/production
        property: redis_password
    - secretKey: secret_key
      remoteRef:
        key: vooglaadija/production
        property: secret_key
    - secretKey: grafana_admin_password
      remoteRef:
        key: vooglaadija/production
        property: grafana_admin_password
---
# Example ClusterSecretStore (Vault backend)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault.internal:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "vooglaadija"
          serviceAccountRef:
            name: "vooglaadija"
            namespace: "vooglaadija"
---
