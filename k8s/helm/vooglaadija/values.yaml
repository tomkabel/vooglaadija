# Default values for vooglaadija.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# Database configuration (external)
db:
  host: ""
  port: "5432"
  name: "vooglaadija"
  user: "vooglaadija"
  password: "changeme"

# Redis configuration (external)
redis:
  host: ""
  port: "6379"
  password: "changeme"

# Existing secret (if not provided, one will be created)
existingSecret: ""

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Network Policy
networkPolicy:
  enabled: true

# Pod Disruption Budgets
podDisruptionBudget:
  api:
    enabled: true
    minAvailable: 1
  worker:
    enabled: true
    minAvailable: 1

# Feature flags
featureFlags:
  metricsEnabled: "true"
  tracingEnabled: "false"
  chaosApiEnabled: "false"

# OpenTelemetry
otel:
  endpoint: "http://otel-collector:4317"

# API configuration
api:
  replicaCount: 2
  image:
    repository: ghcr.io/tomkabel/vooglaadija
    tag: ""
    pullPolicy: IfNotPresent

  secretKey: "change-me-to-a-secure-random-string-min-32-chars"
  corsOrigins: "https://youtube.tomabel.ee"
  cookieSecure: "true"
  accessTokenExpireMinutes: "30"
  refreshTokenExpireDays: "7"

  service:
    type: ClusterIP
    port: 8000

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    hosts:
      - host: youtube.tomabel.ee
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: vooglaadija-tls
        hosts:
          - youtube.tomabel.ee

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi

  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: ""

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Worker configuration
worker:
  replicaCount: 2
  image:
    repository: ghcr.io/tomkabel/vooglaadija
    tag: "worker-latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8082

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    targetQueueDepth: "20"

  resources:
    limits:
      cpu: 750m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 128Mi

  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: ""

  gracePeriod: "25"
  zombieThreshold: "900"
  maxRetries: "3"

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Browser Downloader configuration
browserDownloader:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/tomkabel/vooglaadija
    tag: "browser-downloader-latest"
    pullPolicy: IfNotPresent

  concurrency: "2"
  requestTimeout: "300"

  service:
    type: ClusterIP
    port: 3000

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Monitoring - Prometheus
prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v2.54.1
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 9090

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: ""

# Monitoring - Grafana
grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "11.3.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3000

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: ""

# Subchart configuration for Bitnami PostgreSQL
postgresql:
  enabled: true
  auth:
    username: vooglaadija
    password: "changeme"
    database: vooglaadija
  primary:
    resources:
      limits:
        cpu: 1500m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 256Mi
    persistence:
      enabled: true
      size: 20Gi

# Subchart configuration for Bitnami Redis
redis:
  enabled: true
  auth:
    password: "changeme"
  master:
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 64Mi
    persistence:
      enabled: true
      size: 5Gi
  replica:
    replicaCount: 0
