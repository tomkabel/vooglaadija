apiVersion: v1
kind: Service
metadata:
  name: {{ include "vooglaadija.fullname" . }}-api
  labels:
    {{- include "vooglaadija.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "vooglaadija.apiSelectorLabels" . | nindent 4 }}
