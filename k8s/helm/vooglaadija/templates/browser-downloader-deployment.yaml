{{- if .Values.browserDownloader.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vooglaadija.fullname" . }}-browser-downloader
  labels:
    {{- include "vooglaadija.labels" . | nindent 4 }}
    app.kubernetes.io/component: browser-downloader
spec:
  replicas: {{ .Values.browserDownloader.replicaCount }}
  selector:
    matchLabels:
      {{- include "vooglaadija.browserDownloaderSelectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "vooglaadija.browserDownloaderSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "vooglaadija.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: browser-downloader
          image: "{{ .Values.browserDownloader.image.repository }}:{{ .Values.browserDownloader.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.browserDownloader.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: DOWNLOAD_DIR
              value: "/app/storage/downloads"
            - name: CONCURRENCY
              value: {{ .Values.browserDownloader.concurrency | quote }}
            - name: REQUEST_TIMEOUT
              value: {{ .Values.browserDownloader.requestTimeout | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.browserDownloader.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: storage
              mountPath: /app/storage
      volumes:
        - name: tmp
          emptyDir: {}
        - name: storage
          emptyDir: {}
      {{- with .Values.browserDownloader.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.browserDownloader.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.browserDownloader.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
