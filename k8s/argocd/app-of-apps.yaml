apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: vooglaadija
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Vooglaadija media link processor
  sourceRepos:
    - https://github.com/tomkabel/vooglaadija.git
    - https://charts.bitnami.com/bitnami
  destinations:
    - namespace: vooglaadija
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    - name: vooglaadija-admin
      description: Admin access to vooglaadija project
      policies:
        - p, proj:vooglaadija:vooglaadija-admin, applications, *, vooglaadija/*, allow
      groups:
        - vooglaadija-admins
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vooglaadija
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: vooglaadija
  source:
    repoURL: https://github.com/tomkabel/vooglaadija.git
    targetRevision: main
    path: k8s/helm/vooglaadija
    helm:
      valueFiles:
        - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vooglaadija
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
