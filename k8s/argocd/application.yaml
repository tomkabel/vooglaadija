apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vooglaadija
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: vooglaadija
    app.kubernetes.io/managed-by: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tomkabel/vooglaadija.git
    targetRevision: main
    path: k8s/helm/vooglaadija
    helm:
      valueFiles:
        - values-production.yaml
      parameters:
        - name: api.image.tag
          value: $ARGOCD_APP_REVISION
        - name: worker.image.tag
          value: worker-$ARGOCD_APP_REVISION
        - name: browserDownloader.image.tag
          value: browser-downloader-$ARGOCD_APP_REVISION
  destination:
    server: https://kubernetes.default.svc
    namespace: vooglaadija
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
