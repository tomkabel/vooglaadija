apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vooglaadija-monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: vooglaadija
  source:
    repoURL: https://github.com/tomkabel/vooglaadija.git
    targetRevision: main
    path: k8s/argocd/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
