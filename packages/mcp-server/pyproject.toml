[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vooglaadija-mcp"
version = "1.0.0"
description = "Official Model Context Protocol (MCP) server for Vooglaadija."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
keywords = ["mcp", "model-context-protocol", "agent", "vooglaadija", "youtube", "download"]
dependencies = []

[project.urls]
Homepage = "https://github.com/tomkabel/vooglaadija"
Issues = "https://github.com/tomkabel/vooglaadija/issues"

[project.scripts]
vooglaadija-mcp = "vooglaadija_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
