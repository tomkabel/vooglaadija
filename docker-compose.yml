# ============================================
# A++ Production Docker-Compose - 2026 Best Practices
# Resource Limits, Security, Observability, GitOps Ready
# ============================================

x-common-env: &common-env # Database components (app/config.py constructs URL with proper encoding)
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_NAME: ${DB_NAME:-ytprocessor}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5432}
  # Redis components (app/config.py constructs URL from REDIS_URL or components)
  REDIS_URL: ${REDIS_URL:-}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  FILE_EXPIRE_HOURS: ${FILE_EXPIRE_HOURS:-24}
  STORAGE_PATH: /app/storage
  # Observability
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-vooglaadija}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4317/v1/traces}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4317/v1/metrics}
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4317/v1/logs}
  # Feature flags
  FEATURE_METRICS_ENABLED: ${FEATURE_METRICS_ENABLED:-true}
  FEATURE_TRACING_ENABLED: ${FEATURE_TRACING_ENABLED:-true}
  FEATURE_CHAOS_API_ENABLED: ${FEATURE_CHAOS_API_ENABLED:-false}
  FEATURE_THROTTLE_PREEMPTIVE_ENABLED: ${FEATURE_THROTTLE_PREEMPTIVE_ENABLED:-false}

x-base-service: &base-service
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 1G
      reservations:
        cpus: '0.25'
        memory: 256M
  read_only: true
  tmpfs:
    - /tmp
    - /var/run
    - /var/cache
  user: '1000:1000'
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
  security_opt:
    - no-new-privileges=true

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: ytprocessor-api
    restart: unless-stopped
    environment:
      <<: *common-env
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:8081,http://127.0.0.1:8080}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # Enable observability
      OTEL_PYTHON_TRACER_PROVIDER: otel
      OTEL_PYTHON_METER_PROVIDER: otel
    expose:
      - '8000'
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - storage:/app/storage:Z # SELinux label
      # Config could be mounted as read-only if needed
      # - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *base-service
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request;
          urllib.request.urlopen(''http://localhost:8000/health'', timeout=5)" || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
        compress: 'true'
    # Networks and aliases for service discovery
    networks:
      ytprocessor-network:
        aliases:
          - api
          - backend

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: ytprocessor-worker
    restart: unless-stopped
    environment:
      <<: *common-env
      WORKER_ID: ${HOSTNAME:-worker-1}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-8082}
    volumes:
      - storage:/app/storage:Z
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *base-service
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request;
          urllib.request.urlopen(''http://localhost:8082/health'', timeout=5)" || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
        compress: 'true'
    networks:
      ytprocessor-network:
        aliases:
          - worker

  db:
    image: postgres:15-alpine # Removed problematic digest for now
    container_name: ytprocessor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-ytprocessor}
      # PostgreSQL tuning for containers
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
        compress: 'true'
    ports: []
    # Database typically needs more resources
    # Note: PostgreSQL must run as its default user, not overridden by security-context
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ytprocessor}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Database should be read-only except for data directory
    # This is handled by the volume mount
    networks:
      ytprocessor-network:
        aliases:
          - db

  redis:
    image: redis:7-alpine
    container_name: ytprocessor-redis
    restart: unless-stopped
    # Use exec form for proper signal handling
    command:
      - redis-server
      - --requirepass
      - '${REDIS_PASSWORD}'
      - --appendonly
      - 'yes'
      - --maxmemory
      - '256mb'
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - '' # Disable RDB snapshots (we rely on AOF)
      - --appendfilename
      - 'appendonly.aof'
    volumes:
      - redis_data:/data:Z
    environment:
      REDISCLI_AUTH: '${REDIS_PASSWORD}'
    security_opt:
      - no-new-privileges=true
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
        compress: 'true'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      ytprocessor-network:
        aliases:
          - redis

  # Optional: Observability stack (for local development/testing)
  otel-collector:
    image: otel/opentelemetry-collector:0.88.0
    container_name: otel-collector
    restart: unless-stopped
    command: ['--config=/etc/otel-collector-config.yml']
    volumes:
      - ./infra/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    environment:
      # Used by infra/otel-collector-config.yml env expansion. The fallback is
      # local/dev only; production should set a real OTLP/gRPC backend target.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-localhost:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-false}
    ports:
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    security_opt:
      - no-new-privileges=true
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
        compress: 'true'
    networks:
      ytprocessor-network:
        aliases:
          - otel-collector

  # Nginx reverse proxy for API with SSL
  nginx:
    image: nginx:alpine
    container_name: ytprocessor-nginx
    restart: unless-stopped
    ports:
      - '80:80' # Override with docker-compose.local.yml on rootless systems
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.ssl.local.conf:/etc/nginx/templates/default.conf.template:ro
      - ./infra/ssl:/etc/nginx/ssl:ro
      - ./infra/certbot/data:/var/www/certbot:ro
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/conf.d
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:80/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
        compress: 'true'
    networks:
      ytprocessor-network:
        aliases:
          - nginx

  # Optional: API documentation (for development)
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.1.0 # Pinned version for stability
    container_name: swagger-ui
    restart: unless-stopped
    environment:
      # Route OpenAPI spec fetch through nginx reverse proxy (host:8080 -> nginx:80)
      # This keeps all external traffic through the established reverse proxy architecture.
      # Browser (at swagger-ui host:8081) fetches from nginx (host:8080), which proxies to api:8000
      URL: http://127.0.0.1:8080/openapi.json
    ports:
      - '8081:8080'
    # swagger-ui doesn't need resource limits or security context restrictions
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
        compress: 'true'
    depends_on:
      - api
    networks:
      ytprocessor-network:
        aliases:
          - swagger-ui

volumes:
  postgres_data:
    name: ytprocessor-postgres-data
  redis_data:
    name: ytprocessor-redis-data
  storage:
    name: ytprocessor-storage

networks:
  ytprocessor-network:
    name: ytprocessor-network
    # Enable network isolation and policies
    driver: bridge
    # Internal network for service-to-service communication only
    internal: false
