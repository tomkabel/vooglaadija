# ============================================
# Vooglaadija — API Gateway (Traefik)
# ============================================
# Deploy Traefik as an API gateway in front of the FastAPI application.
# Provides: rate limiting, TLS termination, circuit breaking, security headers.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gateway.yml up -d
#
# The gateway listens on ports 80/443 and routes to the API service.
# TLS note: routers enable TLS with Traefik's default self-signed cert so the
# stack works out of the box. For production, terminate TLS with the
# platform's existing proxy (Coolify/Caddy) or add a `certificatesresolvers`
# entrypoint and reference it from the routers' `tls.certResolver`.
# ============================================

services:
  gateway:
    image: traefik:v3.1
    container_name: ytprocessor-gateway
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    command:
      - --api.dashboard=false
      - --ping=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=ytprocessor-network
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.format=json
      - --metrics.prometheus=true
      - --metrics.prometheus.addEntryPointsLabels=true
      - --metrics.prometheus.addServicesLabels=true
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.options=default
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - traefik-certs:/letsencrypt
    networks:
      - ytprocessor-network
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    labels:
      - traefik.enable=true
      - traefik.http.routers.ping.rule=Path(`/ping`)
      - traefik.http.routers.ping.service=ping@internal
      - traefik.http.routers.ping.entrypoints=websecure

  # Attach the API to the gateway network (in addition to the default network
  # used for inter-service traffic) so Traefik can reach `ytprocessor-api`.
  api:
    networks:
      - default
      - ytprocessor-network

networks:
  # Created automatically when this override is brought up; pre-create it
  # manually if you manage networks separately.
  ytprocessor-network:
    name: ytprocessor-network

volumes:
  traefik-certs:
    name: ytprocessor-traefik-certs
