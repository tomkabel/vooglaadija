# ============================================
# Production Docker Compose Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
#
# This file provides complete overrides for production deployment.
# The base docker-compose.yml provides defaults; this file overrides for production.
# ============================================

x-production-env: &production-env # Security and production observability settings
  CORS_ORIGINS: "https://${DEPLOY_DOMAIN:?DEPLOY_DOMAIN is required}"
  COOKIE_SECURE: "True"
  FEATURE_METRICS_ENABLED: ${FEATURE_METRICS_ENABLED:-true}
  FEATURE_TRACING_ENABLED: ${FEATURE_TRACING_ENABLED:-true}

services:
  # ==========================================
  # Storage Init - Fix volume permissions
  # ==========================================
  storage-init:
    image: alpine:latest
    container_name: ytprocessor-storage-init
    restart: 'no'
    volumes:
      - storage:/app/storage:rw
    command: |
      sh -c "
        echo 'Fixing storage permissions...';
        chown -R 1000:1000 /app/storage 2>/dev/null || true;
        mkdir -p /app/storage/downloads /app/storage/temp 2>/dev/null || true;
        chown -R 1000:1000 /app/storage/downloads /app/storage/temp 2>/dev/null || true;
        echo 'Storage permissions fixed';
        exit 0;
      "
    logging:
      driver: 'loki'
      options:
        loki-url: 'http://localhost:3100/loki/api/v1/push'
        loki-external-labels: 'service=storage-init,container_name=ytprocessor-storage-init,environment=${ENVIRONMENT:-production},project=ytprocessor'

  # ==========================================
  # API Service - Production Overrides
  # ==========================================
  api:
    environment:
      <<: *production-env
      # core.config.Settings builds DB/Redis URLs from component env vars so
      # rotated passwords are URL-encoded correctly.
    # Remove direct port mapping - only access via nginx
    ports: !override []
    # Wait for storage to be initialized
    depends_on:
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import socket; s=socket.socket(); s.settimeout(1); s.connect(('localhost', 8000));
          s.close()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================
  # Worker Service - Production Overrides
  # ==========================================
  worker:
    environment:
      <<: *production-env
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-2}
      # core.config.Settings builds DB/Redis URLs from component env vars so
      # rotated passwords are URL-encoded correctly.
    # Wait for storage initialization
    depends_on:
      storage-init:
        condition: service_completed_successfully

  # ==========================================
  # Nginx - Production SSL Configuration
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: ytprocessor-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # SSL certificates from Let's Encrypt - mount full tree so live symlinks resolve
      - ./infra/letsencrypt:/etc/letsencrypt:ro
      # Production nginx configuration with HTTPS, HTTP/2, secure headers
      - ./infra/nginx/nginx.production.conf:/etc/nginx/templates/default.conf.template:ro
      # Certbot ACME challenge path for Let's Encrypt
      - ./infra/certbot/data:/var/www/certbot:ro
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
      DEPLOY_DOMAIN: "${DEPLOY_DOMAIN:?DEPLOY_DOMAIN is required}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:80/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: 'loki'
      options:
        loki-url: 'http://localhost:3100/loki/api/v1/push'
        loki-external-labels: 'service=nginx,container_name=ytprocessor-nginx,environment=${ENVIRONMENT:-production},project=ytprocessor'
    networks:
      ytprocessor-network:
        aliases:
          - nginx
    profiles: [] # Always run in production

  # ==========================================
  # Certbot - Automatic SSL Renewal (Cloudflare DNS-01)
  # ==========================================
  certbot:
    image: certbot/dns-cloudflare
    container_name: ytprocessor-certbot
    restart: unless-stopped
    volumes:
      # SSL certificates - preserves full LetsEncrypt layout
      # Match nginx's LetsEncrypt mount so renewed certs are visible immediately
      - ./infra/letsencrypt:/etc/letsencrypt:rw
      # Cloudflare API credentials for DNS-01 challenge
      - ./infra/certbot/cloudflare.ini:/etc/letsencrypt/cloudflare.ini:ro
    entrypoint: |
      /bin/sh -c '
        trap exit TERM;
        while :; do
          certbot renew \
            --dns-cloudflare \
            --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
            --dns-cloudflare-propagation-seconds 30 \
            --deploy-hook "sh -c \"touch /etc/letsencrypt/.nginx-reload-required\"" || true;
          sleep 12h;
        done;
      '
    logging:
      driver: 'loki'
      options:
        loki-url: 'http://localhost:3100/loki/api/v1/push'
        loki-external-labels: 'service=certbot,container_name=ytprocessor-certbot,environment=${ENVIRONMENT:-production},project=ytprocessor'
    profiles: [] # Always run in production

  # ==========================================
  # External API Docs UI - Production Disabled
  # ==========================================
  swagger-ui:
    # External interactive API docs are intentionally not exposed in production.
    # OTel collector is inherited from docker-compose.yml and remains enabled.
    profiles: ['nonprod']
    restart: 'no'
    deploy:
      replicas: 0
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
