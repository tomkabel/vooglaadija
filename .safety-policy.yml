version: '3.0'

report:
  dependency-vulnerabilities:
    enabled: true
    auto-ignore-in-report:
      python:
        environment-results: true
        unpinned-requirements: true
      vulnerabilities:
        '64459':
          reason: 'Existing accepted-risk suppression; revisit when upstream fix is available.'
          expires: '2026-12-31'
        '64396':
          reason: 'Existing accepted-risk suppression; revisit when upstream fix is available.'
          expires: '2026-12-31'

fail-scan-with-exit-code:
  dependency-vulnerabilities:
    enabled: true
    fail-on-any-of:
      cvss-severity:
        - medium
        - high
        - critical

security-updates:
  dependency-vulnerabilities:
    auto-security-updates-limit:
      - patch
      - minor
      - major
