# Pre-commit configuration
# Install: pip install pre-commit && pre-commit install
# Run all hooks: pre-commit run --all-files
# Reference: https://pre-commit.com/

default_language_version:
  python: python3.12
  node: system

repos:
  # ==========================================
  # Universal hooks
  # ==========================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '\.md$'
      - id: end-of-file-fixer
        exclude: '\.(svg|db|sqlite|gitkeep|min\.(js|css))$|^app/static/css/styles\.css$|^frontend/css/dist/styles\.css$|pnpm-lock\.yaml|uv\.lock'
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: "pnpm-lock\\.yaml|\\.kilocode/skills/ci-cd/assets/templates/|^docker-compose\\.production\\.yml$"
      - id: check-toml
      - id: check-json
        exclude: "tsconfig\\.json"
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        exclude: '\\.agents/|\\.kilocode/'
      - id: detect-private-key
        exclude: '^infra/ssl/'
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: forbid-submodules
      - id: name-tests-test
        args: [--pytest-test-first]
        exclude: '^tests/conftest\.py$|^tests/__init__\.py$'

  # ==========================================
  # Security: Secret scanning
  # ==========================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: '(^|/)(pnpm-lock\.yaml|uv\.lock)$|^frontend/css/dist/|^app/static/js/htmx\.min\.js$|^infra/ssl/'

  # ==========================================
  # Python: Ruff (lint + format + isort)
  # ==========================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --unsafe-fixes]
        types_or: [python, pyi]
        exclude: '^\.agents/|^\.kilocode/skills/ci-cd/scripts/'
      - id: ruff-format
        types_or: [python, pyi]
        exclude: '^\.agents/|^\.kilocode/skills/ci-cd/scripts/'

  # ==========================================
  # Python: mypy (type checking)
  # ==========================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args:
          [--ignore-missing-imports, --install-types, --non-interactive, --no-warn-unused-ignores]
        additional_dependencies: [pydantic, types-redis, types-python-jose]
        files: '^app/'

  # ==========================================
  # JavaScript/TypeScript: Biome
  # ==========================================
  - repo: https://github.com/biomejs/pre-commit
    rev: v1.9.4
    hooks:
      - id: biome-check
        additional_dependencies: ['@biomejs/biome@1.9.4']
        args:
          - --diagnostic-level=warn
        files: '\.(js|cjs|mjs|jsx|ts|tsx|css|json|jsonc)$'
        exclude: '\.min\.(js|css)$|node_modules/|frontend/css/dist/'

  # ==========================================
  # Shell: ShellCheck (static analysis)
  # ==========================================
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        files: '\.(sh|bash|zsh)$'

  # ==========================================
  # YAML: yamllint
  # ==========================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--config-file, .yamllint]
        files: "\\.(yml|yaml)$"
        exclude: "pnpm-lock\\.yaml|\\.kilocode/skills/ci-cd/assets/templates/"
