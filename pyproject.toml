[build-system]
requires = ["hatchling", "hatch-uv"]
build-backend = "hatchling.build"

[project]
name = "vooglaadija"
version = "1.0.0"
description = "Media Link Processor - REST API Service"
requires-python = ">=3.12"
dependencies = [
    # Core framework
    "alembic",
    "fastapi",
    "uvicorn[standard]",
    "starlette>=1.6.0",  # direct import (deptry DEP003); floor = patched version actually tested (5 GHSAs)
    "sqlalchemy[asyncio]",
    "asyncpg",
    "redis",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt>=4.0,<4.1",  # passlib 1.7.4 cannot load bcrypt >=4.1 (removed __about__); fresh envs otherwise get 5.x
    "pydantic",
    "pydantic-settings>=2.14.2",
    "email-validator>=2.3.0",
    "sse-starlette>=1.6.0",
    "jinja2",
    "python-multipart>=0.0.31",  # Fixes DoS (quadratic querystring parse), parameter smuggling, negative Content-Length buffering
    "prometheus-client>=0.19.0",
    "slowapi>=0.1.9",
    "yt-dlp>=2026.7.4",
    # yt-dlp impersonation target (curl_cffi) — required by extractors that
    # impersonate browser TLS fingerprints; without it they get HTTP 403
    # (e.g. PornHub blocks non-impersonated clients).
    "curl-cffi>=0.5.10",
    "httpx>=0.27.0",

    # HIGH PRIORITY - Observability & Performance Enhancements
    # Structured logging with structlog
    "structlog>=24.0.0",
    # Fast JSON serialization (2-3x faster than stdlib)
    "orjson>=3.9.0",
    # Async event loop performance (2-4x faster)
    "uvloop>=0.19.0; sys_platform != 'win32'",
    # Modern PostgreSQL driver (psycopg3)
    "psycopg[binary]>=3.1.0",

    # SECURITY UPDATES - address transitive dependency vulnerabilities
    "ecdsa>=0.19.2",  # Fixes Minerva timing attack and DoS via improper DER validation
    "cryptography>=50.0.0",  # Fixes PKCS#7 Bleichenbacher oracle, exponential path-building, wildcard DNS escapes
    "pygments>=2.20.0",  # Fixes ReDoS in AdlLexer inefficient regex
    # Lockfile-only CVE fixes must ALSO be floors here, or a lockfile
    # regeneration can silently resolve back below the patched versions
    # (dependabot alerts 67/77/79/80/81/82/85/111/112/128 re-fire).
    "urllib3>=2.7.0",  # transitive via sentry-sdk; request smuggling / TLS regressions
    "idna>=3.15.0",  # transitive; CVE-2025-40558 / CVE-2024-12254
    "mako>=1.3.12",  # transitive via alembic; CVE-2025-31366 (template RCE via crafted cache)
    "pyasn1>=0.6.4",  # transitive; CVE-2025-0395 (panic on malformed BER)
    "authlib>=1.6.9",  # transitive; CVE-2025-62025 (token fixation via empty client secret)

    # MCP (Model Context Protocol) for agentic tool integration
    "mcp>=1.0.0",

    # MEDIUM PRIORITY - Reliability & Debugging
    # Battle-tested retry logic
    "tenacity>=8.2.0",

    # Error tracking and performance monitoring
    "sentry-sdk>=1.40.0",
]

# Optional feature groups
[project.optional-dependencies]
# Observability stack - includes NetData-compatible libraries
observability = [
    "structlog>=24.0.0",
    "orjson>=3.9.0",
    "uvloop>=0.19.0",
    "psycopg[binary]>=3.1.0",
    "tenacity>=8.2.0",
    "sentry-sdk>=1.40.0",
]
server = [
    "fastapi",
    "uvicorn[standard]",
]
worker = [
    "redis",
    "yt-dlp>=2026.7.4",
]
test = [
    "pytest",
    "pytest-cov>=4.1.0",
    "pytest-asyncio",
    "pytest-xdist",
    "httpx>=0.27.0",  # floor must match the main dependency, not be lower
    "aiosqlite",
]
lint = [
    "ruff==0.16.3",  # pinned: matches uv.lock; lint gates must be deterministic
]
type = [
    "mypy==1.19.1",  # pinned: matches uv.lock; type gate deterministic
    "types-redis",
    "types-python-jose",
]
security = [
    "bandit",
    "safety",
    "detect-secrets>=1.5.0",
]
audit = [
    "vulture==2.16",  # pinned: matches uv.lock; audit gates deterministic
    "deptry==0.25.1",  # pinned: matches uv.lock; audit gates deterministic
]
dev = [
    "vooglaadija[test,lint,type,security,audit]",
]

# PEP 735 Dependency Groups - single source of truth for dev dependencies
[dependency-groups]
test = [
    "pytest>=9.0.3",  # SECURITY: Fixes tmpdir handling DoS
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.0.0",
    "httpx>=0.27.0",  # floor must match the main dependency, not be lower
    "aiosqlite>=0.19.0",
]
lint = [
    "ruff==0.16.3",  # pinned: matches uv.lock; lint gates must be deterministic
]
type-check = [
    "mypy==1.19.1",  # pinned: matches uv.lock; type gate deterministic
    "types-redis>=4.5.0",
    "types-python-jose>=0.1.0",
]
security = [
    "bandit>=1.7.0",
    "safety>=2.3.0",
    "detect-secrets>=1.5.0",
]
audit = [
    "vulture==2.16",  # pinned: matches uv.lock; audit gates deterministic
    "deptry==0.25.1",  # pinned: matches uv.lock; audit gates deterministic
]
# Meta group that includes all other groups
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "type-check" },
    { include-group = "security" },
    { include-group = "audit" },
]

# ============================================
# HATCH CONFIGURATION
# ============================================

[tool.hatch]
# Global Hatch settings
# Use UV installer for faster operations (default in hatch 1.10+)
installer = "uv"

# Default environment configuration
[tool.hatch.default]
installer = "uv"
skip-install = false
description = "Default development environment"

[tool.hatch.envs.default.scripts]
dev = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
dev-uvloop = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --loop uvloop"
test = "pytest tests/ -v --cov=app --cov=core --cov-report=term-missing"
lint = "ruff check app/ core/ worker/ scripts/ alembic/ tests/ --output-format=github"
"lint-format" = "ruff format --check app/ core/ worker/ scripts/ alembic/ tests/"
type-check = "mypy app/ core/ worker/ --ignore-missing-imports --install-types --non-interactive"
boundary = "python scripts/import_analysis.py"
# Coverage convenience scripts
cov = "pytest tests/ -v --cov=app --cov=core --cov-report=xml --cov-report=term-missing --cov-report=html"
"cov-html" = "coverage html"
# Clean script
clean = "find . -type d -name __pycache__ -exec rm -rf {} +"
# Database scripts
db-migrate = "alembic upgrade head"
db-rollback = "alembic downgrade -1"
db-history = "alembic history"
db-current = "alembic current"
# Observability scripts
"netdata-status" = "curl -s http://localhost:19999/api/v1/info | jq ."
"netdata-metrics" = "curl -s http://localhost:19999/api/v1/allmetrics?format=json | jq ."
"sentry-test" = "python -c \"import sentry_sdk; sentry_sdk.init(dsn=None); raise Exception('Sentry test')\" 2>&1 || echo 'Sentry test complete'"

# ============================================
# LINT ENVIRONMENT (detached - no project install)
# ============================================
[tool.hatch.envs.lint]
description = "Code linting and formatting"
detached = true
installer = "uv"
skip-install = true
# Use features to install lint dependencies
features = ["lint", "audit"]

[tool.hatch.envs.lint.scripts]
check = "ruff check app/ core/ worker/ scripts/ alembic/ tests/ --output-format=github"
format-check = "ruff format --check app/ core/ worker/ scripts/ alembic/ tests/"
format = "ruff format app/ core/ worker/ scripts/ alembic/ tests/"
fix = "ruff check --fix app/ core/ worker/ scripts/ alembic/ tests/"
boundary = "python scripts/import_analysis.py"
lock-check = "uv lock --check"
dead-code = "vulture app core worker scripts alembic --min-confidence 80"
deps = "deptry ."

# JS/CSS/JSON linting via Biome
lint-js = "cd {root} && pnpm run lint:js"
lint-js-ci = "cd {root} && pnpm run lint:js:ci"

# Markdown linting
lint-md = "cd {root} && pnpm run lint:md"
lint-md-ci = "cd {root} && pnpm run lint:md:ci"

# YAML linting via yamllint
yaml-check = "yamllint --config-file .yamllint .github/ infra/ docker-compose*.yml"

# Shell check
shell-check = """
    shellcheck --severity=warning \
        scripts/cleanup-docker.sh \
        scripts/claim-netdata.sh \
        scripts/install-netdata.sh \
        entrypoint.sh \
        migrate.sh 2>&1 || true
"""

# Format all (prettier for md/yaml)
format-all = "cd {root} && pnpm run format"
format-all-check = "cd {root} && pnpm run format:check"

# Combined lint runner
lint-all = """
    ruff check app/ core/ tests/ --output-format=github && \
    cd {root} && pnpm run lint:ci
"""

# All formatting (Python + JS/CSS/JSON + Markdown + YAML)
format-all-fix = """
    ruff format app/ core/ tests/ && \
    cd {root} && pnpm run format && \
    cd {root} && pnpm run lint:js
"""

# ============================================
# TYPE CHECK ENVIRONMENT
# ============================================
[tool.hatch.envs.type]
description = "Static type checking with mypy"
installer = "uv"
features = ["type"]

[tool.hatch.envs.type.scripts]
check = "mypy app/ core/ worker/ --ignore-missing-imports --install-types --non-interactive"

# ============================================
# TEST ENVIRONMENT WITH MATRIX SUPPORT
# ============================================
[tool.hatch.envs.test]
description = "Testing environment with matrix support"
installer = "uv"
dependency-groups = ["test"]

# Matrix configuration for testing different Python versions and configurations
[[tool.hatch.envs.test.matrix]]
python = ["3.12"]
db = ["sqlite"]

[tool.hatch.envs.test.scripts]
unit = "python -c \"import glob,os;[os.remove(f) for f in glob.glob('.coverage.*')+['.coverage'] if os.path.exists(f)]\" && pytest tests/ --ignore=tests/test_api -v --cov=app --cov=core --cov-report=xml --cov-report=term-missing -n auto"
integration = "python -c \"import glob,os;[os.remove(f) for f in glob.glob('.coverage.*')+['.coverage'] if os.path.exists(f)]\" && pytest tests/test_api/ -v --cov=app --cov=core --cov-report=xml --cov-report=term-missing -n auto"
# Run all tests (both unit and integration)
all = "python -c \"import glob,os;[os.remove(f) for f in glob.glob('.coverage.*')+['.coverage'] if os.path.exists(f)]\" && pytest tests/ -v --cov=app --cov=core --cov-report=xml --cov-report=term-missing -n auto"
# Coverage scripts
cov = "pytest tests/ -v --cov=app --cov=core --cov-report=xml --cov-report=term-missing"
"cov-report" = "coverage report --format=terminal --show-missing"
"cov-html" = "coverage html"

# ============================================
# CI ENVIRONMENT (used by GitHub Actions)
# ============================================
[tool.hatch.envs.ci]
description = "Continuous integration environment"
installer = "uv"
# Disable dev-mode for faster CI installs
dev-mode = false
features = ["test", "lint", "type", "security"]

[tool.hatch.envs.ci.scripts]
# Lint scripts
lint = "ruff check app/ core/ worker/ scripts/ alembic/ tests/ --output-format=github"
"lint-format" = "ruff format --check app/ core/ worker/ scripts/ alembic/ tests/"
boundary = "python scripts/import_analysis.py"
lock-check = "uv lock --check"
# Type check
type-check = "mypy app/ core/ worker/ --ignore-missing-imports --install-types --non-interactive"
# Tests
unit = "python -c \"import glob,os;[os.remove(f) for f in glob.glob('.coverage.*')+['.coverage'] if os.path.exists(f)]\" && pytest tests/ --ignore=tests/test_api -v --cov=app --cov=core --cov-report=xml --cov-report=term-missing -n auto"
integration = "python -c \"import glob,os;[os.remove(f) for f in glob.glob('.coverage.*')+['.coverage'] if os.path.exists(f)]\" && pytest tests/test_api/ -v --cov=app --cov=core --cov-report=xml --cov-report=term-missing -n auto"
# Security
"security-safety" = "safety --stage cicd scan --policy-file .safety-policy.yml --output json > security-report.json"
"security-safety-check" = "safety --stage cicd scan --policy-file .safety-policy.yml --output json > security-report.json"

# Environment variable overrides for CI
[tool.hatch.envs.ci.env-vars]
CI = "true"
HATCH_ENV = "ci"

# ============================================
# SECURITY ENVIRONMENT (detached)
# ============================================
[tool.hatch.envs.security]
description = "Security scanning environment"
detached = true
installer = "uv"
skip-install = true
dependency-groups = ["security"]

[tool.hatch.envs.security.scripts]
scan-secrets = "detect-secrets-hook --baseline .secrets.baseline $(git ls-files ':!:app/static/js/htmx.min.js' ':!:frontend/css/dist/*' ':!:frontend/pnpm-lock.yaml' ':!:pnpm-lock.yaml' ':!:uv.lock' ':!:.secrets.baseline')"
scan-bandit = "bandit -r app/ core/ -f screen --confidence-level high --severity-level medium"
scan-safety = "safety scan --json --output=security-report.json || true"
"bandit-report" = "bandit -r app/ core/ -f html -o bandit_report.html"
"safety-report" = "safety scan --json --output=security-report.json || true"

# ============================================
# AUDIT ENVIRONMENT (weekly repo audit + auto-fix)
# ============================================
[tool.hatch.envs.audit]
description = "Weekly repo audit (bloat, duplication, over-engineering) and auto-fix"
detached = true
installer = "uv"
skip-install = true
# audit: vulture + deptry; lint: ruff; security: detect-secrets (secrets delta
# check must run inside the audit env — an unavailable scanner is an error).
features = ["audit", "lint", "security"]

[tool.hatch.envs.audit.scripts]
# Full deep scan: report + trend. Exit 0 unless internal error (advisory).
weekly = "python scripts/audit_report.py --weekly"
# Shift-left quick checks (fast, local).
quick = "ruff check app/ core/ worker/ scripts/ alembic/ tests/ --output-format=github && deptry ."
# Mechanical auto-fix (safe ruff fixes + formatting); prints changed-file manifest.
fix = "python scripts/audit_report.py --fix"
# Complexity measurement pass (advisory thresholds; strict config in scripts/audit/).
complexity = "ruff check --config scripts/audit/ruff-complexity.toml app/ core/ worker/ scripts/ alembic/ --output-format=github"
dead-code = "vulture app core worker scripts alembic --min-confidence 80"
boundary = "python scripts/import_analysis.py"

# ============================================
# MONITORING ENVIRONMENT (NetData, etc.)
# ============================================
[tool.hatch.envs.monitoring]
description = "Monitoring and observability scripts"
installer = "uv"
skip-install = true  # No dependencies needed for curl scripts

[tool.hatch.envs.monitoring.scripts]
# NetData monitoring
netdata-status = "curl -s http://localhost:19999/api/v1/info | jq ."
netdata-metrics = "curl -s http://localhost:19999/api/v1/allmetrics?format=json | jq ."
netdata-charts = "curl -s http://localhost:19999/api/v1/charts | jq ."
netdata-alarms = "curl -s http://localhost:19999/api/v1/alarms | jq ."
# Sentry test
sentry-test = "python -c \"import sentry_sdk; sentry_sdk.init(dsn=None); raise Exception('Sentry test')\" 2>&1 || echo 'Sentry test complete'"

# ============================================
# INTERNAL HATCH-TEST ENVIRONMENT
# ============================================
[tool.hatch.envs.hatch-test]
# Use UV for faster test environment creation
installer = "uv"
# Use dependency groups
dependency-groups = ["test"]
# Add extra dependencies on top of defaults
extra-dependencies = [
    "pytest-asyncio",
    "httpx",
    "aiosqlite",
]
# Test configuration
default-args = ["tests/", "--ignore=tests/test_api/"]
# Enable test randomization for catching order-dependent bugs
randomize = true
# Parallel execution
parallel = true
# Retry flaky tests
retries = 2
retry-delay = 1

# Override coverage based on environment
[tool.hatch.envs.hatch-test.overrides]
env.COVERAGE.run = { value = { source = ["app", "core"], branch = true, omit = ["*/tests/*", "*/migrations/*"] } }

# ============================================
# BUILD ENVIRONMENT CONFIGURATION
# ============================================
[tool.hatch.envs.hatch-build]
# UV is enabled by default for build environments
installer = "uv"

# Environment variables for reproducible builds
[tool.hatch.envs.hatch-build.env-vars]
SOURCE_DATE_EPOCH = "1580601600"
# Ensure UTF-8 encoding
LC_ALL = "C.UTF-8"
LANG = "C.UTF-8"
HATCH_BUILD_NO_PERMISSION_WARNING = "1"

# ============================================
# BUILD TARGETS CONFIGURATION
# ============================================
[tool.hatch.build.targets.wheel]
# Include Python source files and non-Python assets
include = [
    "app/**/*.py",
    "core/**/*.py",
    "worker/**/*.py",
    "alembic/**/*.py",
    "alembic.ini",
    "app/templates/**",
    "app/static/**",
]

[tool.hatch.build.targets.sdist]
# Include source files and non-Python assets
include = [
    "app/**/*.py",
    "core/**/*.py",
    "worker/**/*.py",
    "pyproject.toml",
    "README.md",
    "alembic/**/*.py",
    "alembic.ini",
    "app/templates/**",
    "app/static/**",
]

# ============================================
# PYTHON CONFIGURATION
# ============================================
[tool.hatch.python]
# Default Python version
version = "3.12"

# ============================================
# PYTEST CONFIGURATION
# ============================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Add custom markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
# Minimum Python version
minversion = "7.0"
# Default args
addopts = "-ra -q"

# ============================================
# COVERAGE CONFIGURATION
# ============================================
[tool.coverage.run]
source = ["app", "core"]
branch = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

# ============================================
# RUFF CONFIGURATION
# ============================================
[tool.ruff]
line-length = 100
target-version = "py312"
# Exclude common directories
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "node_modules",
    ".hatch",
]
fix = true
show-fixes = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie
    "PLC",  # flake8-pylint (statements)
    "PLE",  # flake8-pylint (errors)
    "PLR",  # flake8-pylint (refactor)
    "PLW",  # flake8-pylint (warnings)
    "RUF",  # Ruff-specific rules
    "C90",  # mccabe complexity
    "PGH",  # pygrep-hooks
    "S",    # flake8-bandit (security)
    "ASYNC", # flake8-async (async-safety)
    "TID",  # flake8-tidy-imports (banned imports: layering + yt-dlp ACL)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "PLR0913",  # too many arguments (legacy; measured by audit complexity pass)
    "PLR2004",  # magic value comparison
    "PLC0415",  # import order (required for pytest fixtures in conftest.py)
    "B008",  # function call in default argument (required for FastAPI Depends)
    "C901",  # too complex (legacy; measured by audit complexity pass)
    "PLR0911",  # too many returns (legacy code)
    "PLR0912",  # too many branches (legacy; measured by audit complexity pass)
    "PLR0915",  # too many statements (legacy; measured by audit complexity pass)
    "PLW0603",  # global statement (required for lazy singleton pattern)
    "N802",  # function name case (do_GET required by http.server framework)
    "PLW0406",  # module imports itself (required for test mocking)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR0917", # SQLAlchemy event listener callbacks have a fixed positional signature
    "S101",   # assert is standard in pytest
    "S104",   # binding to all interfaces in test servers
    "S105",   # test secrets are expected
    "S106",   # test credentials are expected
    "S107",   # test defaults are expected
    "S108",   # /tmp usage in tests is acceptable
    "S110",   # try-except-pass in tests is intentional
    "S506",   # yaml.load with compose loader in test files
    "S603",   # subprocess in test_env_contract is for env detection
    "S607",   # partial executable paths in tests
    "ASYNC109", # timeout parameter in test helpers
    "ASYNC240", # os.path in test async functions
]
"app/services/error_classifier.py" = [
    "S311",   # random used for jitter, not cryptographic purposes
    "S110",   # try-except-pass for retry budget is intentional
]
"app/utils/validators.py" = [
    "S310",   # URL open is intentional for redirect validation
]
"core/queue.py" = [
    "S101",   # assert for lazy redis client initialization
    "S110",   # try-except-pass for lazy client is intentional
]
"app/schemas/error.py" = [
    "S105",   # error code enum string values are not passwords
]
"app/schemas/token.py" = [
    "S105",   # token_type string default is not a password
]
"app/auth.py" = [
    "S105",   # token type constants are not passwords
]
"app/services/circuit_breaker.py" = [
    "S110",   # try-except-pass for Redis transient failures
]
"app/services/download_service.py" = [
    "S110",   # try-except-pass for file cleanup
    "ASYNC240", # os.path.exists is used for synchronous file checks
]
"app/services/yt_dlp_service.py" = [
    "ASYNC240", # os.path.getsize for file info after subprocess
    "TID251",   # yt-dlp ACL exemption (see CODEBOUNDARIES.md)
]
# yt-dlp plugin extractors live OUTSIDE app/ and are yt-dlp extensions by
# definition: they must import yt_dlp.* APIs, so the anti-corruption ACL
# (yt-dlp importable only from the facade) does not apply to them.
"yt_dlp_plugins/**/*.py" = ["TID251"]
"app/services/job_factory.py" = [
    "S110",   # try-except-pass for cleanup
]
"app/api/startup.py" = [
    "S110",   # try-except-pass for seed data / trigger registration
]
"app/api/routes/sse.py" = [
    "S110",   # try-except-pass in SSE buffer drain / reconnect
    "ASYNC109", # timeout parameter is a float for task management, not asyncio.timeout
]
# Zone exemptions: the worker itself, tests, tooling, and migrations may import
# worker/ freely. NOTE: the TID251 exemption for worker/** also lifts the
# yt_dlp ban there, so the yt-dlp ACL is enforced independently by
# scripts/import_analysis.py (see CODEBOUNDARIES.md).
"worker/**/*.py" = ["TID251", "S110", "S104"]
"tests/**/*.py" = ["TID251"]
"scripts/**/*.py" = ["TID251", "S105", "S110", "S314", "S603", "S607"]
"alembic/**/*.py" = ["TID251"]

# ============================================
# ARCHITECTURE FITNESS FUNCTIONS (see docs/ARCHITECTURE-STANDARD.md)
# ============================================
[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Layering: neither app/ nor core/ may depend on the worker process.
# NOTE: ruff's banned-api value must be a TABLE: { msg = "..." }. Both a bare
# string and a TOML array are rejected ("expected struct ApiBan").
"worker" = { msg = "app/ and core/ must not import worker/ (CODEBOUNDARIES.md)" }
# Anti-corruption layer: yt-dlp types/exceptions must never leak past its facade.
"yt_dlp" = { msg = "yt-dlp is importable only from app/services/yt_dlp_service.py (ACL)" }

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
known-first-party = ["app", "core", "worker", "tests"]

# ============================================
# MYPY CONFIGURATION
# ============================================
[tool.mypy]
python_version = "3.12"
# NOTE: mypy 1.19.1 re-applies `strict = true` AFTER per-module overrides, so
# overrides cannot relax it. Keep strictness as explicit flags (same set as
# strict) so the worker.* override below can opt worker/ out of untyped-defs —
# the worker rewrite predates strict typing and is checked in CI under lenient
# rules on main.
warn_unused_configs = true
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
pretty = true
show_error_codes = true
show_error_context = true
plugins = ["pydantic.mypy"]
# Strict checks not yet passing — explicitly disabled (as under the original
# `strict = true` + these overrides on the branch)
implicit_reexport = true

# Third-party packages without type stubs
[[tool.mypy.overrides]]
module = [
    "passlib.*",
    "httptools.*",
    "uvloop.*",
    "watchfiles.*",
    "redis.asyncio",
]
ignore_missing_imports = true

# Enable checking for all project modules
[[tool.mypy.overrides]]
module = "app.*"
ignore_errors = false

[[tool.mypy.overrides]]
module = "core.*"
ignore_errors = false

[[tool.mypy.overrides]]
module = "worker.*"
ignore_errors = false
disallow_untyped_defs = false
disallow_untyped_calls = false

# Tests are excluded from strict type checking
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# ============================================
# BANDIT CONFIGURATION
# ============================================
[tool.bandit]
targets = ["app/", "core/", "tests/"]
confidence_level = "HIGH"
severity_level = "MEDIUM"
exclude = [
    "*/tests/*",
    "*/__pycache__/*",
    ".git",
    "node_modules",
]
skips = [
    "B101",  # assert_used (common in tests)
    "B413",  # blacklist (sometimes used for hashing)
]

# ============================================
# DEPTRY CONFIGURATION (unused/undeclared dependencies)
# ============================================
[tool.deptry]
# DEP002 exclusions (declared but not directly imported — all intentional):
# - CLI tools exercised via hatch/CI: ruff, mypy, bandit, safety, detect-secrets,
#   vulture, deptry, types-*, vooglaadija
# - Test-only packages: pytest, pytest-asyncio, pytest-cov, pytest-xdist, aiosqlite
# - Runtime-not-imported framework deps (loaded lazily at runtime):
#   asyncpg (SQLAlchemy URL driver), bcrypt (passlib backend),
#   email-validator (pydantic EmailStr), jinja2 (Jinja2Templates),
#   python-multipart (FastAPI forms), yt-dlp (embedded subprocess script)
# - Deliberate CVE-pinning of transitive deps: ecdsa, cryptography, pygments,
#   urllib3, idna, mako, pyasn1, authlib
# - Test-exercised runtime deps (candidate removals if observability drops):
#   orjson, tenacity
per_rule_ignores = { "DEP002" = ["ruff", "mypy", "bandit", "safety", "detect-secrets", "vulture", "deptry", "pytest", "pytest-asyncio", "pytest-cov", "pytest-xdist", "aiosqlite", "types-redis", "types-python-jose", "vooglaadija", "asyncpg", "bcrypt", "cryptography", "ecdsa", "email-validator", "jinja2", "orjson", "pygments", "python-multipart", "tenacity", "yt-dlp", "urllib3", "idna", "mako", "pyasn1", "authlib"] }
# Module name differs from package name; required because the detached audit
# env runs deptry without the project installed (no auto-detection possible).
package_module_name_map = { "python-jose" = ["jose"] }

# ============================================
# SAFETY CONFIGURATION
# ============================================
[tool.safety]
# Use ignored vulnerabilities database for CI
db = false
ignore = [
    # ECDSA Minerva attack (CVE-2024-23342) - python-ecdsa maintainers explicitly
    # stated they will not fix this as side-channel attacks are "impossible" to
    # mitigate in pure Python. This is a transitive dependency from python-jose.
    "CVE-2024-23342",
]
